[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-traffic-monitor"
version = "1.0.0"
description = "Professional production-quality PySide6 network traffic monitor desktop application"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6.0",
    "psutil>=5.9.0",
    "scapy>=2.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
network-monitor = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
